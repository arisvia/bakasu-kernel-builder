name: Build BakaSU Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Profile'
        required: true
        type: choice
        default: 'polaris'
        options:
          - 'polaris'
          - 'custom'
      release_mode:
        description: 'Publish Mode (release: tagged Release / nightly: rolling prerelease / artifact_only: no release)'
        required: true
        type: choice
        default: 'release'
        options:
          - 'release'
          - 'nightly'
          - 'artifact_only'
      enable_bakasu:
        description: 'Enable BakaSU integration'
        required: true
        type: boolean
        default: true
      enable_docker:
        description: 'Enable Docker / LXC Container Kernel Configs (~250KB)'
        required: false
        type: boolean
        default: false
      custom_repo:
        description: '[Custom] Kernel Git Repo URL (only if device=custom)'
        required: false
        default: ''
      custom_branch:
        description: '[Custom] Kernel Git Branch (only if device=custom)'
        required: false
        default: ''
      custom_defconfig:
        description: '[Custom] Kernel Defconfig (only if device=custom)'
        required: false
        default: ''
  push:
    branches:
      - sdm845
  schedule:
    - cron: '0 20 * * *'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v7

      - name: Load Device Profile
        run: |
          EVENT_NAME="${{ github.event_name }}"
          echo "Event trigger: $EVENT_NAME"

          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "[+] Nightly schedule triggered"
            RELEASE_MODE="nightly"
            DEVICE="polaris"
            ENABLE_BAKASU="true"
            ENABLE_DOCKER="false"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "[+] Push triggered (CI build test only, no release)"
            RELEASE_MODE="artifact_only"
            DEVICE="polaris"
            ENABLE_BAKASU="true"
            ENABLE_DOCKER="false"
          else
            RELEASE_MODE="${{ github.event.inputs.release_mode }}"
            DEVICE="${{ github.event.inputs.device }}"
            ENABLE_BAKASU="${{ github.event.inputs.enable_bakasu }}"
            ENABLE_DOCKER="${{ github.event.inputs.enable_docker }}"
          fi

          echo "RELEASE_MODE=$RELEASE_MODE" >> $GITHUB_ENV
          echo "ENABLE_BAKASU=$ENABLE_BAKASU" >> $GITHUB_ENV
          echo "ENABLE_DOCKER=$ENABLE_DOCKER" >> $GITHUB_ENV
          echo "Requested device profile: $DEVICE"

          if [ "$DEVICE" != "custom" ]; then
            CONFIG_FILE="devices/${DEVICE}.env"
            if [ -f "$CONFIG_FILE" ]; then
              echo "[+] Sourcing $CONFIG_FILE"
              set -a
              source "$CONFIG_FILE"
              set +a
            else
              echo "[-] Error: Profile $CONFIG_FILE does not exist!"
              exit 1
            fi
          else
            echo "[+] Using custom manual inputs..."
            DEVICE_NAME="custom"
            DEVICE_MODEL="Custom Device"
            KERNEL_REPO="${{ github.event.inputs.custom_repo }}"
            KERNEL_BRANCH="${{ github.event.inputs.custom_branch }}"
            KERNEL_DEFCONFIG="${{ github.event.inputs.custom_defconfig }}"
            ARCH="arm64"
            KERNEL_IMAGE_NAME="Image.gz-dtb"
            KERNEL_VERSION_TYPE="4.19"
            CLANG_BRANCH="main"
            CLANG_DIR_NAME="clang-r547379"
            ANYKERNEL3_REPO="https://github.com/osm0sis/AnyKernel3"
            ANYKERNEL3_BRANCH="master"
            KSU_HOOK_METHOD="manual"
          fi

          # Export into GitHub Actions Environment
          echo "DEVICE_NAME=${DEVICE_NAME:-$DEVICE}" >> $GITHUB_ENV
          echo "DEVICE_MODEL=${DEVICE_MODEL:-$DEVICE}" >> $GITHUB_ENV
          echo "KERNEL_REPO=${KERNEL_REPO}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${KERNEL_BRANCH}" >> $GITHUB_ENV
          echo "KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG}" >> $GITHUB_ENV
          echo "ARCH=${ARCH:-arm64}" >> $GITHUB_ENV
          echo "KERNEL_IMAGE_NAME=${KERNEL_IMAGE_NAME:-Image.gz-dtb}" >> $GITHUB_ENV
          echo "KERNEL_VERSION_TYPE=${KERNEL_VERSION_TYPE:-4.19}" >> $GITHUB_ENV
          echo "CLANG_BRANCH=${CLANG_BRANCH:-main}" >> $GITHUB_ENV
          echo "CLANG_DIR_NAME=${CLANG_DIR_NAME:-clang-r547379}" >> $GITHUB_ENV
          echo "ANYKERNEL3_REPO=${ANYKERNEL3_REPO:-https://github.com/osm0sis/AnyKernel3}" >> $GITHUB_ENV
          echo "ANYKERNEL3_BRANCH=${ANYKERNEL3_BRANCH:-master}" >> $GITHUB_ENV
          echo "KSU_HOOK_METHOD=${KSU_HOOK_METHOD:-manual}" >> $GITHUB_ENV

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev make python3 python-is-python3 \
            device-tree-compiler zip unzip tar patch \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Toolchain (AOSP Clang / LLVM)
        run: |
          mkdir -p toolchain
          echo "[+] Fetching AOSP Clang (${{ env.CLANG_BRANCH }} / ${{ env.CLANG_DIR_NAME }})..."
          if git clone -q --depth=1 --filter=blob:none --sparse --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b "${{ env.CLANG_BRANCH }}" toolchain/clang-repo 2>/dev/null; then
            git -C toolchain/clang-repo sparse-checkout set "${{ env.CLANG_DIR_NAME }}"
          else
            rm -rf toolchain/clang-repo
            git clone -q --depth=1 --single-branch \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
              -b "${{ env.CLANG_BRANCH }}" toolchain/clang-repo
          fi
          CLANG_DIR="$(pwd)/toolchain/clang-repo/${{ env.CLANG_DIR_NAME }}"
          "$CLANG_DIR/bin/clang" --version

          echo "TOOLCHAIN_DIR=$(pwd)/toolchain" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR/bin" >> $GITHUB_PATH
      - name: Clone Kernel Source
        run: |
          echo "[+] Cloning ${{ env.KERNEL_REPO }} (branch: ${{ env.KERNEL_BRANCH }})..."
          git clone --depth=1 "${{ env.KERNEL_REPO }}" -b "${{ env.KERNEL_BRANCH }}" kernel-source

      - name: Integrate BakaSU
        if: ${{ env.ENABLE_BAKASU == 'true' }}
        run: |
          cd kernel-source
          echo "[+] Installing BakaSU driver..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

          if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
            if grep -q "ksu_handle_execveat" fs/exec.c 2>/dev/null; then
              echo "[+] Native BakaSU manual hooks already integrated in kernel source."
            elif [ -f "../patches/${{ env.KERNEL_VERSION_TYPE }}/manual-hook.patch" ]; then
              echo "[+] Applying manual hook patch..."
              patch -p1 < "../patches/${{ env.KERNEL_VERSION_TYPE }}/manual-hook.patch"
            else
              echo "[-] Warning: Manual hooks not found in fs/exec.c and no patch file present."
            fi
          fi

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH="${{ env.CLANG_DIR }}/bin:$PATH"
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export KBUILD_BUILD_USER=kernel
          export KBUILD_BUILD_HOST=build

          mkdir -p out

          MAKE_ARGS=(
            O=out
            ARCH="${{ env.ARCH }}"
            CC="clang"
            LD="ld.lld"
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE="aarch64-linux-gnu-"
            CROSS_COMPILE="aarch64-linux-gnu-"
            CROSS_COMPILE_COMPAT="arm-linux-gnueabi-"
          )

          echo "[+] Generating defconfig: ${{ env.KERNEL_DEFCONFIG }}..."
          make "${MAKE_ARGS[@]}" ${{ env.KERNEL_DEFCONFIG }}

          if [ "${{ env.ENABLE_BAKASU }}" = "true" ]; then
            echo "[+] Enabling BakaSU in config..."
            scripts/config --file out/.config -e KSU
            if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
              scripts/config --file out/.config \
                -e KSU_MANUAL_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
                -d KSU_TRACEPOINT_HOOK
            else
              scripts/config --file out/.config \
                -e KSU_TRACEPOINT_HOOK \
                -d KSU_MANUAL_HOOK
            fi
          fi

          if [ "${{ env.ENABLE_DOCKER }}" = "true" ]; then
            echo "[+] Enabling Docker / LXC Container kernel configs..."
            scripts/config --file out/.config \
              -e NAMESPACES -e UTS_NS -e IPC_NS -e USER_NS -e PID_NS -e NET_NS \
              -e SYSVIPC -e POSIX_MQUEUE \
              -e CGROUPS -e CGROUP_PIDS -e CGROUP_DEVICE -e CGROUP_FREEZER \
              -e CPUSETS -e MEMCG -e MEMCG_SWAP -e BLK_CGROUP \
              -e CGROUP_SCHED -e FAIR_GROUP_SCHED -e CFS_BANDWIDTH -e CGROUP_PERF \
              -e BRIDGE -e BRIDGE_NETFILTER -e VETH -e DUMMY \
              -e MACVLAN -e IPVLAN -e VXLAN \
              -e NETFILTER_XT_MATCH_ADDRTYPE -e NETFILTER_XT_MATCH_CGROUP \
              -e IP_VS -e IP_NF_NAT -e IP_NF_TARGET_MASQUERADE \
              -e OVERLAY_FS -e BINFMT_MISC
          fi

          make "${MAKE_ARGS[@]}" olddefconfig

          echo "[+] Compiling Kernel with $(nproc) cores..."
          make -j$(nproc) "${MAKE_ARGS[@]}"
          echo "[+] Checking compilation outputs..."
          TARGET_FILE="out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}"
          if [ ! -f "$TARGET_FILE" ]; then
            if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz-dtb"
            elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz"
            elif [ -f "out/arch/arm64/boot/Image" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image"
            else
              echo "[-] Error: Kernel binary not found in out/arch/arm64/boot/!"
              ls -la out/arch/arm64/boot/ || true
              exit 1
            fi
          fi

          echo "Target kernel file found: $TARGET_FILE"
          echo "KERNEL_OUTPUT_BIN=$(pwd)/$TARGET_FILE" >> $GITHUB_ENV

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL3_REPO }}" -b "${{ env.ANYKERNEL3_BRANCH }}" anykernel3
          cd anykernel3
          rm -rf .git .github .gitignore ramdisk patch modules

          echo "[+] Copying kernel image to AnyKernel3..."
          cp "${{ env.KERNEL_OUTPUT_BIN }}" ./

          cat > anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=BakaSU Kernel for ${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=${{ env.DEVICE_NAME }}
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          # boot shell variables
          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install (kernel-only split/flash without touching ramdisk)
          split_boot;
          flash_boot;
          ## end boot install
          EOF
          sed -i 's/^          //' anykernel.sh

          DATE_TAG=$(date +%Y%m%d_%H%M%S)
          if [ "${{ env.RELEASE_MODE }}" = "nightly" ]; then
            ZIP_NAME="BakaSU-${{ env.DEVICE_NAME }}-nightly.zip"
          else
            ZIP_NAME="BakaSU-${{ env.DEVICE_NAME }}-${DATE_TAG}.zip"
          fi

          echo "RELEASE_ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "BUILD_DATE=$DATE_TAG" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RELEASE_ZIP_NAME }}
          path: ${{ env.RELEASE_ZIP_PATH }}

      - name: Publish Official GitHub Release
        if: env.RELEASE_MODE == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          name: BakaSU Kernel for ${{ env.DEVICE_MODEL }} (${{ env.BUILD_DATE }})
          body: |
            ### BakaSU Kernel Build Result
            - **Device**: `${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})`
            - **Kernel Source**: `${{ env.KERNEL_REPO }}`
            - **Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Toolchain**: AOSP Clang `${{ env.CLANG_DIR_NAME }}`
            - **BakaSU Enabled**: `${{ env.ENABLE_BAKASU }}`
            
            #### 刷入方式：
            1. 下载下方的 `.zip` 刷机包。
            2. 重启手机进入 Axion / AOSP 官方 Recovery。
            3. 选择 `Apply update` -> `Apply from ADB`。
            4. 电脑运行 `adb sideload <文件名>.zip`。
          files: |
            ${{ env.RELEASE_ZIP_PATH }}
            ${{ env.KERNEL_OUTPUT_BIN }}

      - name: Publish Rolling Nightly GitHub Release
        if: env.RELEASE_MODE == 'nightly'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly-${{ env.DEVICE_NAME }}
          name: '[Nightly] BakaSU Kernel for ${{ env.DEVICE_MODEL }}'
          prerelease: true
          make_latest: false
          body: |
            ### [Nightly] BakaSU Kernel Rolling Build
            *自动滚动更新的每夜版内核，始终包含最新内核优化与 BakaSU 驱动。*
            
            - **Device**: `${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})`
            - **Kernel Source**: `${{ env.KERNEL_REPO }}`
            - **Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Toolchain**: AOSP Clang `${{ env.CLANG_DIR_NAME }}`
            - **Build Date**: `${{ env.BUILD_DATE }}`
            
            #### 刷入方式：
            1. 下载下方的 `BakaSU-${{ env.DEVICE_NAME }}-nightly.zip` 刷机包。
            2. 重启手机进入 Axion / AOSP 官方 Recovery。
            3. 选择 `Apply update` -> `Apply from ADB`。
            4. 电脑运行 `adb sideload BakaSU-${{ env.DEVICE_NAME }}-nightly.zip`。
          files: |
            ${{ env.RELEASE_ZIP_PATH }}
            ${{ env.KERNEL_OUTPUT_BIN }}
