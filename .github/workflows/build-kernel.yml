name: Build BakaSU Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Profile (filename without .env in devices/)'
        required: true
        default: 'polaris'
      custom_repo:
        description: '[Custom] Kernel Git Repo URL (only if device=custom)'
        required: false
        default: ''
      custom_branch:
        description: '[Custom] Kernel Git Branch (only if device=custom)'
        required: false
        default: ''
      custom_defconfig:
        description: '[Custom] Kernel Defconfig (only if device=custom)'
        required: false
        default: ''
      enable_bakasu:
        description: 'Enable BakaSU integration'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Load Device Profile
        run: |
          DEVICE="${{ github.event.inputs.device }}"
          echo "Requested device profile: $DEVICE"

          if [ "$DEVICE" != "custom" ]; then
            CONFIG_FILE="devices/${DEVICE}.env"
            if [ -f "$CONFIG_FILE" ]; then
              echo "[+] Sourcing $CONFIG_FILE"
              set -a
              source "$CONFIG_FILE"
              set +a
            else
              echo "[-] Error: Profile $CONFIG_FILE does not exist!"
              exit 1
            fi
          else
            echo "[+] Using custom manual inputs..."
            DEVICE_NAME="custom"
            DEVICE_MODEL="Custom Device"
            KERNEL_REPO="${{ github.event.inputs.custom_repo }}"
            KERNEL_BRANCH="${{ github.event.inputs.custom_branch }}"
            KERNEL_DEFCONFIG="${{ github.event.inputs.custom_defconfig }}"
            ARCH="arm64"
            KERNEL_IMAGE_NAME="Image.gz-dtb"
            KERNEL_VERSION_TYPE="4.19"
            CLANG_BRANCH="android13-release"
            CLANG_DIR_NAME="clang-r450784d"
            GCC_BRANCH="android12L-release"
            ANYKERNEL3_REPO="https://github.com/osm0sis/AnyKernel3"
            ANYKERNEL3_BRANCH="master"
            KSU_HOOK_METHOD="manual"
          fi

          # Export into GitHub Actions Environment
          echo "DEVICE_NAME=${DEVICE_NAME:-$DEVICE}" >> $GITHUB_ENV
          echo "DEVICE_MODEL=${DEVICE_MODEL:-$DEVICE}" >> $GITHUB_ENV
          echo "KERNEL_REPO=${KERNEL_REPO}" >> $GITHUB_ENV
          echo "KERNEL_BRANCH=${KERNEL_BRANCH}" >> $GITHUB_ENV
          echo "KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG}" >> $GITHUB_ENV
          echo "ARCH=${ARCH:-arm64}" >> $GITHUB_ENV
          echo "KERNEL_IMAGE_NAME=${KERNEL_IMAGE_NAME:-Image.gz-dtb}" >> $GITHUB_ENV
          echo "KERNEL_VERSION_TYPE=${KERNEL_VERSION_TYPE:-4.19}" >> $GITHUB_ENV
          echo "CLANG_BRANCH=${CLANG_BRANCH:-android13-release}" >> $GITHUB_ENV
          echo "CLANG_DIR_NAME=${CLANG_DIR_NAME:-clang-r450784d}" >> $GITHUB_ENV
          echo "GCC_BRANCH=${GCC_BRANCH:-android12L-release}" >> $GITHUB_ENV
          echo "ANYKERNEL3_REPO=${ANYKERNEL3_REPO:-https://github.com/osm0sis/AnyKernel3}" >> $GITHUB_ENV
          echo "ANYKERNEL3_BRANCH=${ANYKERNEL3_BRANCH:-master}" >> $GITHUB_ENV
          echo "KSU_HOOK_METHOD=${KSU_HOOK_METHOD:-manual}" >> $GITHUB_ENV

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev libncurses-dev make python3 \
            device-tree-compiler zip unzip tar patch

      - name: Setup Toolchain (AOSP Clang & GCC)
        run: |
          mkdir -p toolchain
          echo "[+] Fetching AOSP Clang (${{ env.CLANG_BRANCH }})..."
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            -b "${{ env.CLANG_BRANCH }}" toolchain/clang-repo
          CLANG_DIR="$(pwd)/toolchain/clang-repo/${{ env.CLANG_DIR_NAME }}"

          echo "[+] Fetching GCC aarch64..."
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            -b "${{ env.GCC_BRANCH }}" toolchain/gcc64

          echo "[+] Fetching GCC arm32..."
          git clone -q --depth=1 --single-branch \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 \
            -b "${{ env.GCC_BRANCH }}" toolchain/gcc32

          echo "TOOLCHAIN_DIR=$(pwd)/toolchain" >> $GITHUB_ENV
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_ENV
          echo "$CLANG_DIR/bin:$(pwd)/toolchain/gcc64/bin:$(pwd)/toolchain/gcc32/bin" >> $GITHUB_PATH

      - name: Clone Kernel Source
        run: |
          echo "[+] Cloning ${{ env.KERNEL_REPO }} (branch: ${{ env.KERNEL_BRANCH }})..."
          git clone --depth=1 "${{ env.KERNEL_REPO }}" -b "${{ env.KERNEL_BRANCH }}" kernel-source

      - name: Integrate BakaSU
        if: ${{ github.event.inputs.enable_bakasu }}
        run: |
          cd kernel-source
          echo "[+] Installing BakaSU driver..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -

          if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
            echo "[+] Checking for manual hook patch in patches/${{ env.KERNEL_VERSION_TYPE }}..."
            PATCH_FILE="../patches/${{ env.KERNEL_VERSION_TYPE }}/manual-hook.patch"
            if [ -f "$PATCH_FILE" ]; then
              echo "[+] Applying manual hook patch: $PATCH_FILE"
              patch -p1 < "$PATCH_FILE"
            else
              echo "[-] Warning: No patch found at $PATCH_FILE"
            fi
          fi

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH="${{ env.CLANG_DIR }}/bin:${{ env.TOOLCHAIN_DIR }}/gcc64/bin:${{ env.TOOLCHAIN_DIR }}/gcc32/bin:$PATH"
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.ARCH }}
          export KBUILD_BUILD_USER=kernel
          export KBUILD_BUILD_HOST=build

          mkdir -p out

          echo "[+] Generating defconfig: ${{ env.KERNEL_DEFCONFIG }}..."
          make O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_DEFCONFIG }}

          if [ "${{ github.event.inputs.enable_bakasu }}" = "true" ]; then
            echo "[+] Enabling BakaSU in config..."
            scripts/config --file out/.config -e KSU
            if [ "${{ env.KSU_HOOK_METHOD }}" = "manual" ]; then
              scripts/config --file out/.config \
                -e KSU_MANUAL_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
                -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
                -d KSU_TRACEPOINT_HOOK
            else
              scripts/config --file out/.config \
                -e KSU_TRACEPOINT_HOOK \
                -d KSU_MANUAL_HOOK
            fi
          fi

          echo "[+] Compiling Kernel with $(nproc) cores..."
          make -j$(nproc) O=out ARCH=${{ env.ARCH }} \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            CROSS_COMPILE="${{ env.TOOLCHAIN_DIR }}/gcc64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="${{ env.TOOLCHAIN_DIR }}/gcc32/bin/arm-linux-androideabi-" \
            LD=ld.lld LLVM=1 LLVM_IAS=1

          echo "[+] Checking compilation outputs..."
          TARGET_FILE="out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }}"
          if [ ! -f "$TARGET_FILE" ]; then
            if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz-dtb"
            elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image.gz"
            elif [ -f "out/arch/arm64/boot/Image" ]; then
              TARGET_FILE="out/arch/arm64/boot/Image"
            else
              echo "[-] Error: Kernel binary not found in out/arch/arm64/boot/!"
              ls -la out/arch/arm64/boot/ || true
              exit 1
            fi
          fi

          echo "Target kernel file found: $TARGET_FILE"
          echo "KERNEL_OUTPUT_BIN=$(pwd)/$TARGET_FILE" >> $GITHUB_ENV

      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL3_REPO }}" -b "${{ env.ANYKERNEL3_BRANCH }}" anykernel3
          cd anykernel3
          rm -rf .git .github .gitignore

          echo "[+] Copying kernel image to AnyKernel3..."
          cp "${{ env.KERNEL_OUTPUT_BIN }}" ./

          # Update device check in anykernel.sh
          sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE_NAME }}/g" anykernel.sh || true
          sed -i "s|BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|" anykernel.sh || true
          sed -i "s/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/" anykernel.sh || true

          DATE_TAG=$(date +%Y%m%d_%H%M%S)
          ZIP_NAME="BakaSU-${{ env.DEVICE_NAME }}-${DATE_TAG}.zip"
          zip -r9 "$ZIP_NAME" * -x README.md *placeholder

          echo "RELEASE_ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "RELEASE_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "BUILD_DATE=$DATE_TAG" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ZIP_NAME }}
          path: ${{ env.RELEASE_ZIP_PATH }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          name: BakaSU Kernel for ${{ env.DEVICE_MODEL }} (${{ env.BUILD_DATE }})
          body: |
            ### BakaSU Kernel Build Result
            - **Device**: `${{ env.DEVICE_MODEL }} (${{ env.DEVICE_NAME }})`
            - **Kernel Source**: `${{ env.KERNEL_REPO }}`
            - **Branch**: `${{ env.KERNEL_BRANCH }}`
            - **Toolchain**: AOSP Clang `${{ env.CLANG_DIR_NAME }}`
            - **BakaSU Enabled**: `${{ github.event.inputs.enable_bakasu }}`
            
            #### 刷入方式：
            1. 下载下方的 `.zip` 刷机包。
            2. 重启手机进入 Axion / AOSP 官方 Recovery。
            3. 选择 `Apply update` -> `Apply from ADB`。
            4. 电脑运行 `adb sideload <文件名>.zip`。
          files: |
            ${{ env.RELEASE_ZIP_PATH }}
            ${{ env.KERNEL_OUTPUT_BIN }}
